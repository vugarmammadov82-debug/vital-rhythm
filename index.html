<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vital Rhythm</title>
<meta name="description" content="Kalori, su, şəkil analizi, GPS hərəkət və sağlam menyu — by VUİM">
<meta name="theme-color" content="#0B5D4B">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vital Rhythm">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: phone app — top bar with back arrow, routed views, bottom tab bar with a raised camera button. */
:root{
  --bg:#EFF4F1; --surface:#FFFFFF; --surface2:#E4ECE8; --ink:#13201B; --muted:#5A6B64; --line:#D5E0DA;
  --brand:#0B5D4B; --brand2:#12866B; --on-brand:#FFFFFF; --accent:#0F7A62; --accent-ink:#FFFFFF;
  --sun:#E0A21C; --water:#2484C4; --coral:#E26B4E; --violet:#6E5BD0;
  --ok:#15803D; --warn:#B45309; --danger:#C0262D; --danger-bg:#FDECEA; --warn-bg:#FFF3DE;
  --display:"Unbounded","Manrope",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0C1311; --surface:#141E1B; --surface2:#1C2925; --ink:#E4EEE9; --muted:#91A39C; --line:#26342F;
  --brand:#0D4A3D; --brand2:#15705A; --on-brand:#EAFBF4; --accent:#3CC7A4; --accent-ink:#04241B;
  --sun:#F2BC45; --water:#5DB6EA; --coral:#F08A70; --violet:#9C8CF0;
  --ok:#4ADE80; --warn:#F5A65B; --danger:#F26B5E; --danger-bg:#3A1A17; --warn-bg:#36280F; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* top bar */
.top{position:sticky;top:0;z-index:1000;background:var(--brand);color:var(--on-brand);padding-top:env(safe-area-inset-top,0px)}
.top .in{max-width:560px;margin:0 auto;height:56px;display:flex;align-items:center;gap:8px}
.top .ttl{flex:1;min-width:0;display:flex;flex-direction:column}
.top .ttl b{font-family:var(--display);font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;opacity:.75}
.ib{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.12);color:inherit;padding:0;flex:none}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.top .pill{font-size:12px;font-weight:800;padding:8px 12px;border-radius:99px;background:var(--sun);color:#1b1300}
main{max-width:560px;margin:0 auto;padding-block:16px calc(110px + var(--bb,0px) + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--display);font-weight:500;font-size:17px;margin:0;text-wrap:balance}
h3{font-size:12px;margin:0;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:13px}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 16px;font-weight:700;background:var(--surface2);color:var(--ink)}
button.primary{background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;border:1px solid var(--line)}
button.big{padding:17px;font-size:17px;border-radius:18px;width:100%}
button.red{background:var(--danger);color:#fff}
button:active{transform:scale(.98)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
textarea{min-height:72px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:370px){.grid3{grid-template-columns:1fr 1fr}}
/* hero */
.hero{background:linear-gradient(155deg,var(--brand) 0%,var(--brand2) 100%);color:var(--on-brand);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:28px solid rgba(255,255,255,.07)}
.hero .hi{font-size:13px;font-weight:700;opacity:.8}
.hero .msg{font-family:var(--display);font-size:20px;font-weight:700;line-height:1.2;margin:2px 0 0;text-wrap:balance}
.hrow{display:grid;grid-template-columns:140px 1fr;gap:14px;align-items:center;position:relative;z-index:1}
.ring{position:relative;width:140px;height:140px}
.ring svg{width:140px;height:140px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .c b{font-family:var(--display);font-size:27px;font-weight:800;line-height:1}
.ring .c span{font-size:11px;font-weight:700;opacity:.8}
.hk{display:flex;flex-direction:column;gap:8px}
.hk div{display:flex;justify-content:space-between;gap:8px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.14);padding-bottom:6px}
.hk div:last-child{border:0}
.hk b{font-weight:800}
.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.mac div{background:rgba(255,255,255,.1);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:5px;min-width:0}
.mac small{font-size:11px;font-weight:800;opacity:.85}
.mac b{font-size:14px}
.mbar{height:5px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:9px}
/* quick tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:800;color:var(--ink)}
.tile i{width:46px;height:46px;border-radius:15px;display:grid;place-items:center}
.tile svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.alert{border-radius:16px;padding:12px 14px;font-weight:600;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.alert.danger{background:var(--danger-bg);color:var(--danger)}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.info{background:var(--surface2);color:var(--ink)}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:currentColor;margin-top:5px}
.water{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.glass{width:58px;height:78px;border:3px solid var(--water);border-top:0;border-radius:4px 4px 16px 16px;position:relative;overflow:hidden}
.glass i{position:absolute;left:0;right:0;bottom:0;background:var(--water);opacity:.85}
.list{display:flex;flex-direction:column}
.item{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line);align-items:center;width:100%;text-align:left;background:transparent;border-radius:0;color:var(--ink);font-weight:500}
.item:first-child{border-top:0}
.item .n{min-width:0;display:flex;gap:10px;align-items:center}
.item .n > div{min-width:0}
.item .n b{display:block;font-weight:700;overflow-wrap:anywhere}
.item .n span{font-size:12px;color:var(--muted)}
.item .k{font-weight:800;white-space:nowrap}
.av{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff}
.x{background:transparent;color:var(--muted);padding:6px 8px;font-size:20px;line-height:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;padding:8px 13px;border-radius:99px;font-size:13px;background:var(--surface2);font-weight:800}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.tag{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2.2}
.search input{padding-left:38px}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:var(--bb,0px);z-index:1000;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
nav.tabs button{background:transparent;border-radius:0;padding:9px 2px 11px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800}
nav.tabs button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}
nav.tabs .cam .bub{width:60px;height:60px;margin-top:-28px;border-radius:22px;background:linear-gradient(150deg,var(--coral),var(--sun));display:grid;place-items:center;box-shadow:0 10px 22px -8px var(--coral);border:4px solid var(--surface)}
nav.tabs .cam .bub svg{width:28px;height:28px;stroke:#fff}
nav.tabs .live{position:relative}
nav.tabs .live::after{content:"";position:absolute;top:6px;right:calc(50% - 16px);width:9px;height:9px;border-radius:50%;background:var(--danger)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--bb,0px) + env(safe-area-inset-bottom,0px));z-index:1002;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.chart{width:100%;height:auto;display:block}
.meal{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.day{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.day:first-child{border-top:0}
.day b{color:var(--accent)}
ul.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.tipcard{background:linear-gradient(150deg,color-mix(in srgb,var(--sun) 22%,var(--surface)),var(--surface) 70%)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:800}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface2);padding:5px;border-radius:16px}
.seg button{padding:10px 4px;background:transparent;border-radius:12px}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:0 2px 6px -3px rgba(0,0,0,.3)}
/* home quadrants: soft tinted fields, deep ink for icons */
:root{--q5:#FFF1CC;--q5i:#A86A00;--q6:#FCE3EE;--q6i:#B0336A;--q1:#FFE6DA;--q1i:#D2553A;--q2:#DDF2E8;--q2i:#0F7A62;--q3:#E9E4FB;--q3i:#5B47C2;--q4:#DCEDFA;--q4i:#1F6FAE}
@media (prefers-color-scheme: dark){:root{--q5:#3A2F12;--q5i:#F5C451;--q6:#3B1F2C;--q6i:#F49AC0;--q1:#3A2620;--q1i:#F2A48E;--q2:#173329;--q2i:#6FE0BE;--q3:#272240;--q3i:#B8ABFA;--q4:#18293A;--q4i:#86C3F2}}
.status{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:12px 14px}
.status .ring{width:76px;height:76px}.status .ring svg{width:76px;height:76px}
.status .ring .c b{font-size:16px}.status .ring .c span{font-size:9.5px}
.status .ss{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.status .hi{font-size:12px;font-weight:700;color:var(--muted)}
.status .msg{font-family:var(--display);font-size:16px;font-weight:700;line-height:1.2;text-wrap:balance}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills span{font-size:12px;font-weight:800;padding:4px 9px;border-radius:99px;background:var(--surface2)}
.quads{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quad{transition:transform .18s cubic-bezier(.2,1.4,.4,1),box-shadow .18s;min-height:118px;border-radius:26px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;gap:10px;position:relative;overflow:hidden;border:0}
.quad::after{content:"";position:absolute;right:-34px;bottom:-34px;width:110px;height:110px;border-radius:50%;background:currentColor;opacity:.07}
.quad .qi{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;background:var(--surface);box-shadow:0 6px 14px -8px rgba(0,0,0,.35)}
.quad .qi svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.quad b{display:block;font-family:var(--display);font-size:17px;font-weight:700;line-height:1.15;color:var(--ink)}
.quad small{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:3px}
.q1{background:var(--q1);color:var(--q1i)}.q2{background:var(--q2);color:var(--q2i)}.q3{background:var(--q3);color:var(--q3i)}.q4{background:var(--q4);color:var(--q4i)}
.q5{background:var(--q5);color:var(--q5i)}.q6{background:var(--q6);color:var(--q6i)}
.quad:hover{transform:scale(1.03)}.quad:active,.quad.press{transform:scale(1.07);box-shadow:0 14px 28px -14px currentColor;z-index:2}
@media (prefers-reduced-motion:reduce){.quad,.quad:active,.quad.press,.quad:hover{transform:none;transition:none}}
.tip{border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(140deg,var(--q5),var(--surface) 80%);border:1px solid var(--line)}
.tip .tt{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tip .tt button{flex:none;padding:6px 11px;border-radius:99px;font-size:12px;font-weight:800;background:color-mix(in srgb,var(--surface) 75%,transparent);color:var(--muted)}
.tip .tt button.on{background:var(--q5i);color:#fff}
.tip b.h{font-family:var(--display);font-size:16px;line-height:1.25}
.tip p{margin:0;font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tip a{color:var(--accent);font-weight:800;font-size:12.5px}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:148px;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.strip button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:800}
.strip button b{font-family:var(--display);font-size:16px}
/* restaurants */
#rmap{height:230px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--surface2);z-index:0}
.pcard{border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(150deg,var(--q1),var(--surface) 75%);border:1px solid var(--line)}
.disc{font-family:var(--display);font-weight:800;font-size:15px;padding:6px 11px;border-radius:12px;background:var(--coral);color:#fff;white-space:nowrap}
.hl{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--q2);color:var(--q2i)}
.coupon{border-radius:24px;padding:20px;background:var(--surface);border:2px dashed var(--coral);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.coupon .code{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:.06em;word-break:break-all}
#qr{background:#fff;padding:12px;border-radius:16px}
#qr img,#qr canvas{display:block}
/* clear calorie balance */
.eq{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;align-items:center;gap:4px;text-align:center}
.eq div{display:flex;flex-direction:column;gap:2px;min-width:0}
.eq b{font-family:var(--display);font-size:17px;font-weight:800}
.eq small{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.eq i{font-style:normal;font-weight:800;color:var(--muted);font-size:18px}
.eq .res b{color:var(--accent)}.eq .res.over b{color:var(--danger)}
details.why summary{cursor:pointer;font-size:13px;font-weight:800;color:var(--accent)}
details.why p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.mrow{display:grid;grid-template-columns:110px 1fr 74px;gap:8px;align-items:center;font-size:13px}
.mrow small{display:block;color:var(--muted);font-size:11px}
/* live tracking bar */
#liveBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:1001;border-radius:99px;padding:9px 16px;background:var(--danger);color:#fff;font-weight:800;font-size:13px;box-shadow:0 8px 20px -8px rgba(0,0,0,.5);display:flex;gap:8px;align-items:center}
#liveBar i{width:9px;height:9px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}
/* guide */
#guide{position:fixed;z-index:1001;width:62px;height:62px;border-radius:50%;padding:0;border:3px solid #fff;background:var(--surface) center/cover no-repeat;box-shadow:0 10px 24px -8px rgba(0,0,0,.45);touch-action:none;cursor:grab}
#guide::after{content:"";position:absolute;right:-1px;bottom:2px;width:14px;height:14px;border-radius:50%;background:#25D366;border:2px solid #fff}
#guide .gdot{position:absolute;top:-6px;left:-6px;min-width:20px;height:20px;border-radius:99px;background:var(--coral);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
#gpanel{position:fixed;z-index:1002;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(88px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;max-height:min(72vh,560px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 50px -20px rgba(0,0,0,.5);overflow:hidden}
#gpanel .gh{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(150deg,var(--brand),var(--brand2));color:var(--on-brand)}
#gpanel .gh img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.7)}
#gpanel .gh b{font-family:var(--display);font-size:15px;display:block}
#gpanel .gh small{opacity:.85;font-weight:700;font-size:12px}
#gpanel .gb{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.msg{max-width:86%;padding:10px 12px;border-radius:16px;font-size:14px;line-height:1.4}
.msg.g{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px;align-self:flex-start}
.msg.u{background:#DCF8C6;color:#13201B;border-bottom-right-radius:6px;align-self:flex-end}
.msg.u small{display:block;color:#3c6b4c;font-size:11px;margin-top:3px;font-weight:700}
#gpanel .gq{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 0;scrollbar-width:none}
#gpanel .gf{display:flex;gap:8px;padding:10px 12px 12px;align-items:flex-end}
#gpanel textarea{min-height:44px;max-height:110px;flex:1}
.wa{background:#25D366;color:#06301a;font-weight:800}
/* shop */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;min-width:0;position:relative}
.pimg{aspect-ratio:1/1;width:100%;max-width:100%;display:grid;place-items:center;font-family:var(--display);font-size:34px;font-weight:800;color:#fff;background-size:cover;background-position:center;border:0;padding:0;border-radius:0}
.pc .pb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.pc .pn{font-weight:800;font-size:14px;line-height:1.25;overflow-wrap:anywhere;text-align:left;background:transparent;padding:0;border-radius:0}
.pc .pv{font-size:12px;color:var(--muted)}
.price{font-family:var(--display);font-weight:800;font-size:16px}
.old{font-size:12px;color:var(--muted);text-decoration:line-through;margin-left:4px}
.heart{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;padding:0;display:grid;place-items:center;background:rgba(255,255,255,.9);color:#C0262D;font-size:17px;line-height:1}
.badge-s{position:absolute;top:8px;left:8px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--coral);color:#fff}
.addc{padding:9px;border-radius:12px;font-size:13px;margin-top:auto}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:auto}
.stepper button{padding:8px 12px;border-radius:0;background:var(--surface2);font-size:16px}
.stepper span{flex:1;text-align:center;font-weight:800}
#cartBar{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:1000;max-width:536px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-radius:18px;background:var(--ink);color:var(--bg);font-weight:800;box-shadow:0 14px 30px -12px rgba(0,0,0,.5)}
nav.tabs .cb{position:relative}
nav.tabs .cb em{position:absolute;top:4px;left:calc(50% + 4px);min-width:18px;height:18px;border-radius:99px;background:var(--coral);color:#fff;font-style:normal;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.ship{height:8px;border-radius:9px;background:var(--surface2);overflow:hidden}.ship i{display:block;height:100%;background:var(--ok);border-radius:9px}
.ostat{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--q2);color:var(--q2i)}
.radio{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.radio label{display:flex;gap:8px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;font-weight:700;font-size:14px;cursor:pointer}
.radio input{width:auto}
/* scan */
.drop{border:2px dashed var(--line);border-radius:20px;min-height:200px;display:grid;place-items:center;text-align:center;padding:14px;background:var(--bg);overflow:hidden}
.drop img{width:100%;max-height:320px;object-fit:cover;border-radius:14px;display:block}
.drop .ph{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted)}
.drop .ph svg{width:46px;height:46px;stroke:var(--coral);fill:none;stroke-width:1.7}
.filebtn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;padding:15px;font-weight:800;font-size:15px;background:var(--surface2);color:var(--ink);cursor:pointer}
.filebtn.main{background:linear-gradient(150deg,var(--coral),var(--sun));color:#fff}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.verdict{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px}
.verdict .v{font-family:var(--display);font-size:24px;font-weight:800;white-space:nowrap}
.verdict.hi{background:var(--danger-bg);color:var(--danger)}
.verdict.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface));color:var(--ok)}
.verdict.lo{background:var(--warn-bg);color:var(--warn)}
.ritem{display:grid;grid-template-columns:1fr 80px 52px;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.ritem:first-child{border-top:0}
.ritem input{padding:8px;text-align:right}
.ritem .k{text-align:right;font-weight:800}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.qs{margin:4px 0 0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px}
code{background:var(--surface2);padding:2px 6px;border-radius:6px;font-size:13px;overflow-wrap:anywhere}

#map{height:290px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--surface2);z-index:0}
.bigstat{display:flex;align-items:baseline;justify-content:center;gap:6px}
.bigstat b{font-family:var(--display);font-size:56px;font-weight:800;line-height:1}
.bigstat span{color:var(--muted);font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{background:var(--surface2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}

.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.gpsq i{width:8px;height:8px;border-radius:50%;background:currentColor}
.leaflet-container{font-family:var(--body)}
.sheet{position:fixed;inset:0;z-index:1003;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}

// ================= CALC
function calc(){
  const p=S.profile,w=+p.w||70,h=+p.h||170,a=+p.age||30;
  const bmr=10*w+6.25*h-5*a+(p.sex==="m"?5:-161),tdee=bmr*ACT[p.act][1];
  let target=tdee+(p.goal==="lose"?-500:p.goal==="gain"?300:0);const floor=p.sex==="m"?1500:1200;if(target<floor)target=floor;target=Math.round(target/10)*10;
  const prot=Math.round(w*(p.goal==="lose"?1.6:p.goal==="gain"?1.8:1.2)),fat=Math.round(target*0.3/9),carb=Math.max(0,Math.round((target-prot*4-fat*9)/4));
  return{bmr:Math.round(bmr),tdee:Math.round(tdee),target,prot,fat,carb,water:Math.round(w*35/50)*50,bmi:w/((h/100)**2)};
}
function entry(f){const r=FMAP[f.n]||[f.n,f.k100||0,f.p100||0,f.f100||0,f.c100||0];const x=f.g/100;return{k:r[1]*x,p:r[2]*x,fa:r[3]*x,c:r[4]*x}}
function exK(e){if(e.kcal!=null)return e.kcal;const m=(EX.find(x=>x[0]===e.n)||[0,4])[1];return m*3.5*(+S.profile.w||70)/200*e.min}
function totals(k=TODAY){const d=S.days[k]||{foods:[],ex:[],water:0};const t={k:0,p:0,fa:0,c:0};d.foods.forEach(f=>{const e=entry(f);t.k+=e.k;t.p+=e.p;t.fa+=e.fa;t.c+=e.c});t.burn=(d.ex||[]).reduce((s,e)=>s+exK(e),0);t.water=d.water||0;t.steps=(d.ex||[]).reduce((s,e)=>s+(+e.steps||0),0);return t}
const r0=n=>Math.round(n);
function streak(){const c=calc();let n=0;for(let i=1;i<60;i++){const d=new Date();d.setDate(d.getDate()-i);const t=totals(dk(d));if(t.k>0&&t.k<=c.target+t.burn)n++;else break}const t=totals();if(t.k>0&&t.k<=c.target+t.burn)n++;return n}

// ================= ALERTS
function alerts(t,c){
  const out=[],limit=c.target+t.burn,over=t.k-limit;
  if(over>0)out.push(["danger",`Gündəlik normanı ${r0(over)} kkal aşdınız. Təxminən ${r0(over/4.3)} dəqiqə sürətli yeriş bunu balanslaşdırar.`]);
  else if(t.k>limit*0.9)out.push(["warn",`Normanın ${r0(t.k/limit*100)}%-i doldu. Qalan: ${r0(limit-t.k)} kkal.`]);
  if(t.fa>c.fat*1.15)out.push(["warn",`Yağ normadan çoxdur: ${r0(t.fa)} q / ${c.fat} q.`]);
  if(t.c>c.carb*1.2)out.push(["warn",`Karbohidrat normadan çoxdur: ${r0(t.c)} q / ${c.carb} q.`]);
  if(new Date().getHours()>=14&&t.water<c.water*0.5)out.push(["info",`Su azdır: ${t.water} ml / ${c.water} ml. Bir stəkan su için.`]);
  return out;
}

function weekChart(c){
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push([d,totals(dk(d)).k])}
  if(!days.some(x=>x[1]>0))return "";
  const W=340,H=170,L=34,B=24,T=12,max=Math.max(c.target*1.3,...days.map(x=>x[1])),y=v=>T+(H-T-B)*(1-v/max),bw=(W-L-8)/7;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Son 7 gün">`;
  [0,Math.round(max/2/100)*100].forEach(v=>s+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${v}</text>`);
  days.forEach(([d,k],i)=>{const x=L+4+i*bw;s+=`<rect x="${x+bw*.18}" y="${y(k)}" width="${bw*.64}" height="${H-B-y(k)}" rx="5" fill="${k>c.target?"var(--danger)":"var(--accent)"}" opacity="${i===6?1:.7}"/><text x="${x+bw/2}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--muted)">${AZWS[d.getDay()]}</text>`});
  s+=`<line x1="${L}" x2="${W}" y1="${y(c.target)}" y2="${y(c.target)}" stroke="var(--sun)" stroke-width="2" stroke-dasharray="5 4"/><text x="${W-2}" y="${y(c.target)-5}" font-size="10" text-anchor="end" fill="var(--sun)" font-weight="700">hədəf ${c.target}</text></svg>`;
  return `<section class="card"><h2>Son 7 gün</h2>${s}</section>`;
}

function shrink(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const m=1280,sc=Math.min(1,m/Math.max(img.width,img.height)),cv=document.createElement("canvas");cv.width=r0(img.width*sc);cv.height=r0(img.height*sc);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);res(cv.toDataURL("image/jpeg",0.82).split(",")[1])};img.onerror=()=>rej(new Error("img"));img.src=URL.createObjectURL(file)})}
// Newer models first; aliases follow Google's current release. Each key type is tried on every route Google accepts it on.
const MODELS=["gemini-flash-latest","gemini-2.5-flash","gemini-3-flash-preview","gemini-flash-lite-latest","gemini-2.5-flash-lite"];
const ROUTES=[
  (m,k)=>({url:`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,h:{"x-goog-api-key":k}}),
  (m,k)=>({url:`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(k)}`,h:{}}),
  (m,k)=>({url:`https://aiplatform.googleapis.com/v1/publishers/google/models/${m}:generateContent?key=${encodeURIComponent(k)}`,h:{}})
];
async function askAI(parts,signal){
  const k=aiKey(),body=JSON.stringify({contents:[{role:"user",parts}],generationConfig:{responseMimeType:"application/json",temperature:0.3}});
  const models=S.ai.model?[S.ai.model,...MODELS.filter(x=>x!==S.ai.model)]:MODELS;
  const order=S.ai.route!=null?[S.ai.route,...[0,1,2].filter(i=>i!==S.ai.route)]:[0,1,2];
  let last=null;
  for(const ri of order){
    for(const m of models){
      const o=ROUTES[ri](m,k);let r;
      try{r=await fetch(o.url,{method:"POST",signal,headers:{"Content-Type":"application/json",...o.h},body})}
      catch(e){if(e?.name==="AbortError")throw e;last={status:"net",msg:String(e?.message||e)};break}
      const j=await r.json().catch(()=>({}));
      if(r.ok){
        S.ai.model=m;S.ai.route=ri;save();
        const txt=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");
        const a=txt.indexOf("{"),b=txt.lastIndexOf("}");if(a<0)throw{status:"json"};
        return JSON.parse(txt.slice(a,b+1));
      }
      const msg=j?.error?.message||"",st=j?.error?.status||"";last={status:r.status,msg,st};
      if(r.status===404||(r.status===400&&/model/i.test(msg)&&!/key/i.test(msg)))continue; // this model is gone, try the next
      if(r.status===429||r.status>=500)throw last;                                         // busy or over quota
      break;                                                                                // key rejected here, try the next route
    }
  }
  S.ai.route=null;S.ai.model=null;save();
  throw last||{status:"net"};
}
function aiErrText(e){
  if(e?.name==="AbortError")return "";
  const tail=e?.msg?`<br><span class="small" style="opacity:.8">Google: ${esc(String(e.msg).slice(0,160))}${e.status?" ("+e.status+")":""}</span>`:"";
  if(e?.message==="img")return "Şəkil oxunmadı. Başqa şəkil seçin.";
  if(e?.status===429)return "Pulsuz limit bir müddət doldu. Bir dəqiqə sonra yenidən cəhd edin."+tail;
  if(e?.status==="json")return "Cavab oxunmadı. Yenidən cəhd edin.";
  if(e?.status===403&&/referer|referrer/i.test(e.msg||""))return "Açarın sayt məhdudiyyəti səhvdir. Google Cloud-da bunu yazın: <code>https://vugarmammadov82-debug.github.io/*</code>"+tail;
  if(e?.status===401||e?.status===403||(e?.status===400&&/key/i.test(e.msg||"")))return "Google AI açarını qəbul etmədi. Yeni açar lazımdır."+tail;
  if(e?.status==="net"||!navigator.onLine)return "Google-a qoşulmaq alınmadı. İnterneti yoxlayın."+tail;
  return "Xəta baş verdi. Yenidən cəhd edin."+tail;
}

function placeOrder(){
  const name=$("#coName").value.trim(),phone=normPhone($("#coPhone").value),del=document.querySelector('[name=coDel]:checked').value,pay=document.querySelector('[name=coPay]:checked').value,city=$("#coCity").value.trim(),addr=$("#coAddr").value.trim(),note=$("#coNote").value.trim();
  if(!name)return toast("Adınızı yazın");if(phone.length<11)return toast("Nömrəni düzgün yazın: +994 50 123 45 67");if(del==="Çatdırılma"&&!addr)return toast("Ünvanı yazın");
  if(!CONFIG.shop.whatsapp)return toast("Mağazanın WhatsApp nömrəsi hələ qoşulmayıb");
  S.lastShip={name,phone,del,pay,city,addr,note};if(!S.user)S.user={name,phone};
  const {sum,fee,total}=cartSum(),d=new Date(),no=`VR-${String(d.getFullYear()).slice(2)}${pad(d.getMonth()+1)}${pad(d.getDate())}-${Math.random().toString(36).slice(2,6).toUpperCase()}`;
  const items=S.cart.map(c=>{const p=pById(c.id);return p?{id:p.id,name:p.name,price:p.price,q:c.q}:null}).filter(Boolean);
  const txt=`🛒 Yeni sifariş ${no}\n\n${items.map((x,i)=>`${i+1}. ${x.name} × ${x.q} = ${money(x.price*x.q)}`).join("\n")}\n\nMəhsullar: ${money(sum)}\nÇatdırılma: ${fee?money(fee):"pulsuz"}\nCƏMİ: ${money(total)}\n\n👤 ${name}\n📞 ${fmtPhone(phone)}\n🚚 ${del}${del==="Çatdırılma"?`: ${city}, ${addr}`:""}\n💳 ${pay}${note?`\n📝 ${note}`:""}\n\n— Vital Rhythm`;
  S.orders.unshift({no,at:Date.now(),items,sum,fee,total,del,status:"Göndərildi"});S.cart=[];save();updCart();
  openWA(CONFIG.shop.whatsapp,txt);history.replaceState({d:depth()},"","#orders");route();toast("Sifariş hazırlandı. WhatsApp-da göndərin.");
}

function route(){if(typeof G!=="undefined"&&G.open){G.open=false;renderGuide()}render();window.scrollTo(0,0)}
function render(){
  if(MAP){MAP.remove();MAP=null;LINE=null;ME=null}
  const h=curHash(),base=h.split("-")[0],tab=TABS.includes(base)?base:(["food","fi"].includes(base)?"diary":["prod","cart","checkout","orders","admin"].includes(base)?"shop":["move","act","rest","coupon"].includes(base)?"home":"");
  const [t1,t2]=h.startsWith("prod-")?["Məhsul",pById(h.slice(5))?.cat||""]:h==="coupon"?["Endirim kuponu","Kassada göstərin"]:h.startsWith("act")?["Hərəkət","Nəticə"]:h.startsWith("fi-")?["Miqdar seçin",FMAP[decodeURIComponent(h.slice(3))]?.[6]||""]:(TITLES[h]||TITLES[tab]||TITLES.home);
  $("#ttl").textContent=t1;$("#sub").textContent=t2;$("#backBtn").hidden=h==="home";$("#profBtn").hidden=h==="profile";
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  const v=$("#view");
  v.innerHTML=h==="shop"?vShop():h.startsWith("prod-")?vProd(h.slice(5)):h==="cart"?vCart():h==="checkout"?vCheckout():h==="orders"?vOrders():h==="admin"?vAdmin():h==="reg"?vReg():h==="home"?vHome():h==="diary"?vDiary():h==="rest"?vRest():h==="coupon"?vCoupon():h==="food"?vFood():h.startsWith("fi-")?vFoodItem(decodeURIComponent(h.slice(3))):h==="scan"?vScan():h==="ai"?vAI():h==="move"?vMove():h.startsWith("act-")?vActivity(+h.slice(4)):h==="plan"?vPlan():h==="profile"?vProfile():vHome();
  if(h==="move")initMap(TR.pts,TR.state!=="idle");
  if(h==="rest")initRestMap();
  updCart();liveDot();if(!h.startsWith("prod-"))PQ=1;
  if(h==="coupon")drawQR();
  if(h.startsWith("act-")&&S.acts[+h.slice(4)])initMap(S.acts[+h.slice(4)].pts,false);
  if(h==="move"&&TR.state==="idle"&&TR.acc==null&&S.gpsAsked&&"geolocation" in navigator)navigator.geolocation.getCurrentPosition(p=>{TR.acc=p.coords.accuracy;if(MAP)MAP.setView([p.coords.latitude,p.coords.longitude],16);updLive()},()=>{},{enableHighAccuracy:true,timeout:15000});
  bind(h);
}

  on("[data-fav]","click",e=>{const id=e.currentTarget.dataset.fav;S.favs=S.favs.includes(id)?S.favs.filter(x=>x!==id):[...S.favs,id];save();toast(S.favs.includes(id)?"Sevimlilərə əlavə edildi":"Sevimlilərdən çıxarıldı");render()});
  on("[data-q]","click",e=>{const id=e.currentTarget.dataset.q,d=+e.currentTarget.dataset.d;setQty(id,cartQty(id)+d);if(d>0&&cartQty(id)===1)toast("Səbətə əlavə edildi");render()});
  on("[data-rm]","click",e=>{setQty(e.currentTarget.dataset.rm,0);render()});
  on("#pqM","click",()=>{PQ=Math.max(1,PQ-1);render()});on("#pqP","click",()=>{PQ++;render()});
  on("#pAdd","click",()=>{const id=h.slice(5);setQty(id,cartQty(id)+PQ);toast(`Səbətə əlavə edildi (${PQ})`);PQ=1;render()});
  on("#cartClear","click",()=>{S.cart=[];save();updCart();render()});
  on("#coSend","click",placeOrder);
  on("[data-reorder]","click",e=>{const o=S.orders[+e.currentTarget.dataset.reorder];o.items.forEach(x=>{if(pById(x.id))setQty(x.id,cartQty(x.id)+x.q)});toast("Məhsullar səbətə əlavə edildi");go("cart")});
  on("[data-ask]","click",e=>{const o=S.orders[+e.currentTarget.dataset.ask];if(!CONFIG.shop.whatsapp)return toast("Mağazanın nömrəsi hələ qoşulmayıb");openWA(CONFIG.shop.whatsapp,`Salam! ${o.no} nömrəli sifarişimin statusu nədir?\n${S.user?S.user.name+" ("+fmtPhone(S.user.phone)+")":""}`)});
  on("#adIn","click",()=>{if($("#adPin").value===CONFIG.shop.adminPin){S.adminOk=1;save();render()}else toast("PIN səhvdir")});
  on("#adOut","click",()=>{S.adminOk=0;save();back()});
  on("#adReload","click",async()=>{toast("Yenilənir…");await loadShop(true);toast(`Kataloq: ${SHOP.items.length} məhsul`)});
  on("#adTpl","click",async()=>{const t="id\tkateqoriya\tad\tqiymət\tköhnə qiymət\tşəkil\ttəsvir\thəcm\tstok\ttövsiyə\nP001\tBitki çayları\tNümunə çay\t12\t15\t\tQısa təsvir\t20 paket\tvar\tbəli";try{await navigator.clipboard.writeText(t);toast("Kopyalandı — Google cədvəlinə yapışdırın")}catch(e){toast("Kopyalamaq alınmadı")}});
  on("[data-rf]","click",e=>{REST.filter=e.currentTarget.dataset.rf;render()});
  on("[data-coupon]","click",e=>{CPN=e.currentTarget.dataset.coupon;S.coupons.push({p:CPN,t:Date.now()});save();go("coupon")});
  // food
  on("[data-cat]","click",e=>{CAT=e.currentTarget.dataset.cat;render()});
  const q=$("#q");if(q)q.addEventListener("input",e=>{Q=e.target.value;const pos=e.target.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)});
  on("[data-f]","click",e=>go("fi-"+encodeURIComponent(e.currentTarget.dataset.f)));
  if($("#g")){$("#g").addEventListener("input",prevFood);prevFood();on("[data-por]","click",e=>{$("#g").value=e.currentTarget.dataset.por;prevFood()})}
  on("#addF","click",()=>{const n=decodeURIComponent(h.slice(3)),gr=+$("#g").value;if(!(gr>0))return toast("Miqdarı yazın");const f=FMAP[n];day().foods.push({n,g:gr,m:$("#m").value});if(f[7])day().water+=gr;afterAdd(`${f[0]} əlavə edildi`);back()});
  on("#addC","click",()=>{const n=$("#cn").value.trim(),k=+$("#ck").value,gr=+$("#cg").value;if(!n||!(k>=0)||!(gr>0))return toast("Ad, kalori və miqdarı doldurun");day().foods.push({n,g:gr,m:$("#cm").value,k100:k});afterAdd(`${n} əlavə edildi`);goTab("home")});
  // scan
  on("#camIn,#galIn","change",e=>{const f=e.target.files[0];if(!f)return;SC.note=$("#note").value;if(SC.url)URL.revokeObjectURL(SC.url);SC.file=f;SC.url=URL.createObjectURL(f);SC.res=null;SC.err="";render();if(aiKey())analyze()});
  on("#anal","click",analyze);on("#stopA","click",()=>SC.ctl?.abort());on("#note","input",e=>SC.note=e.target.value);
  on("[data-gi]","change",e=>{SC.res.items[+e.target.dataset.gi].grams=+e.target.value||0;render()});
  on("#scAdd","click",()=>{const m=$("#scMeal").value;SC.res.items.forEach(i=>{if(+i.grams>0)day().foods.push({n:String(i.name),g:r0(+i.grams),m,ai:1,k100:+i.kcal_per100||0,p100:+i.p100||0,f100:+i.f100||0,c100:+i.c100||0})});
    if(SC.url)URL.revokeObjectURL(SC.url);Object.assign(SC,{file:null,url:"",note:"",res:null,err:""});afterAdd("Əlavə edildi");goTab("home")});
  on("#aiSave","click",async e=>{
    const k=$("#aiKey").value.replace(/[\s"'`]+/g,""),msg=$("#aiMsg"),btn=e.currentTarget;$("#aiKey").value=k;
    const say=(t,c)=>{msg.hidden=false;msg.style.color=c;msg.innerHTML=t};
    if(k.length<20)return say("Açar çox qısadır. Google-dakı kopyala ikonuna basıb yenidən yapışdırın.","var(--danger)");
    btn.disabled=true;say("Açar yoxlanılır…","var(--muted)");
    try{const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=1",{headers:{"x-goog-api-key":k}});
      if(r.ok){S.ai.key=k;save();toast("Açar işləyir və yadda saxlanıldı");back();return}
      const j=await r.json().catch(()=>({})),m=j?.error?.message||"";
      if(r.status===400||r.status===401)say("Google bu açarı qəbul etmədi. Açarı yenidən kopyalayın. ("+esc(m.slice(0,100))+")","var(--danger)");
      else if(r.status===403)say("Açar var, amma Gemini xidməti bu layihədə aktiv deyil. AI Studio-da yeni açar yaradın. ("+esc(m.slice(0,100))+")","var(--danger)");
      else{S.ai.key=k;save();say("Açar yadda saxlanıldı, amma yoxlama alınmadı ("+r.status+"). Şəkil çəkib sınayın.","var(--warn)")}
    }catch(err){S.ai.key=k;save();say("İnternet yoxlaması alınmadı, açar yadda saxlanıldı. Şəkil çəkib sınayın.","var(--warn)")}
    finally{btn.disabled=false}});
  on("#aiTest","click",async e=>{const b=e.currentTarget,o=$("#aiTestOut");b.disabled=true;o.hidden=false;o.innerHTML="Yoxlanılır…";
    try{const r=await askAI([{text:'Yalnız bu JSON-u qaytar: {"ok":true}'}]);o.innerHTML=`<span style="color:var(--ok);font-weight:800">İşləyir ✓</span> <span class="muted">(${esc(S.ai.model)}, yol ${S.ai.route+1})</span>`}
    catch(err){o.innerHTML=`<span style="color:var(--danger);font-weight:700">${aiErrText(err)||"Dayandırıldı"}</span>`}finally{b.disabled=false}});
  on("#aiDel","click",()=>{S.ai.key="";save();toast("Açar silindi");render()});
  // plan
  on("[data-pt]","click",e=>{PLANTAB=e.currentTarget.dataset.pt;render()});
  on("[data-herb]","click",e=>{const i=+e.currentTarget.dataset.herb;if(curHash()!=="plan"){PLANTAB="tips";OPENHERB=i;goTab("plan");return}OPENHERB=OPENHERB===i?-1:i;render()});
  on("#pmGo","click",buildMenu);on("#pmStop","click",()=>PM.ctl?.abort());
  on("[data-pmd]","click",e=>{PM.day=+e.currentTarget.dataset.pmd;render()});
  on("#pmAdd","click",()=>{const d=S.pmenu.days[PM.day];(d.meals||[]).forEach(m=>{const meal=MEALS.includes(m.meal)?m.meal:"Ara qəlyanaltı";(m.items||[]).forEach(i=>{if(+i.grams>0)day().foods.push({n:String(i.name),g:r0(+i.grams),m:meal,ai:1,k100:+i.kcal_per100||0,p100:+i.p100||0,f100:+i.f100||0,c100:+i.c100||0})})});afterAdd("Gündəliyə əlavə edildi");goTab("diary")});
  on("#usePlan","click",()=>{scaledPlan().forEach(([m,it])=>it.forEach(([n,g])=>day().foods.push({n,g,m})));afterAdd("Menyu bugünə əlavə edildi");goTab("home")});
  // profile
  on("#saveP","click",()=>{S.profile={sex:$("#p_sex").value,age:+$("#p_age").value,h:+$("#p_h").value,w:+$("#p_w").value,act:+$("#p_act").value,goal:$("#p_goal").value};S.first=false;save();toast("Yadda saxlanıldı");back()});
  on("#howInstall","click",showInstall);
  on("#wipe","click",()=>{$("#wipeC").hidden=false});on("#wipeN","click",()=>{$("#wipeC").hidden=true});
  on("#wipeY","click",()=>{S.days={};S.acts=[];save();render();toast("Bütün qeydlər silindi")});
  // move
  on("[data-sport]","click",e=>{TR.sport=e.currentTarget.dataset.sport;render()});
  on("#trStart","click",()=>{S.gpsAsked=true;save();startTrack()});
  on("#trPause","click",()=>{TR.state="paused";TR.curSp=0;render()});
  on("#trResume","click",()=>{TR.state="running";TR.lastTick=Date.now();const l=TR.pts[TR.pts.length-1];if(l)l[3]=Date.now();render()});
  on("#trStop","click",stopTrack);
  on("[data-act]","click",e=>go("act-"+e.currentTarget.dataset.act));
  on("#actDel","click",()=>{S.acts.splice(+h.slice(4),1);save();toast("Silindi");back()});
  on("#shareImg","click",async()=>{const a=S.acts[+h.slice(4)];shareFile(await routeImage(a),`vital-rhythm-${new Date(a.start).toISOString().slice(0,10)}.png`,`${SPORTS[a.sport][0]}: ${(a.dist/1000).toFixed(2)} km, ${fmtT(a.t)}`)});
  on("#shareGpx","click",()=>{const a=S.acts[+h.slice(4)];shareFile(new Blob([gpx(a)],{type:"application/gpx+xml"}),`vital-rhythm-${new Date(a.start).toISOString().slice(0,10)}.gpx`,"GPX marşrut")});
}
$("#cartBar").onclick=()=>go("cart");
$("#liveBar").onclick=()=>go("move");
guideInit();loadShop();
render();
if(!S.user&&!S.regAsked){S.regAsked=1;save();setTimeout(()=>go("reg"),400)}
</script>
</body>
</html>
